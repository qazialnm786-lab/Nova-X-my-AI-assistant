name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Verifying Java environment..."
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$JAVA_VER_STRING" ]; then
            echo "ERROR: Failed to detect Java version."
            exit 1
          fi
          MAJOR_VER=$(echo "$JAVA_VER_STRING" | awk -F. '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java major version: $MAJOR_VER"
          if [ -z "$MAJOR_VER" ] || [ "$MAJOR_VER" -lt 17 ] 2>/dev/null; then
            echo "ERROR: Java major version must be 17 or newer. Found: $MAJOR_VER"
            exit 1
          fi
          echo "Java environment verification passed: active Java major version is $MAJOR_VER."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore"
              exit 1
            fi
            echo "Temporary debug.keystore successfully generated."
          fi

      - name: Build debug APK
        id: build_apk
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" 2>/dev/null || echo "No APKs discovered."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK exists but is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: Expected file does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK path mismatch: expected app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "APK verified successfully: $EXPECTED_APK ($APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$ASSET_DIR"

          RAW_REPO_NAME="${{ github.repository }}"
          REPO_SHORT=$(echo "$RAW_REPO_NAME" | awk -F/ '{print $2}')
          SANITIZED_NAME=$(echo "$REPO_SHORT" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
          if [ -z "$SANITIZED_NAME" ]; then
            SANITIZED_NAME="android-app"
          fi

          ASSET_FILENAME="${SANITIZED_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Release asset prepared: $ASSET_PATH ($ASSET_FILENAME)"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty. Skipping release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_NOTES=$(cat << 'EOF'
          ### NOVA-X Debug APK Build

          - **Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${{ github.sha }}
          - **Intended Use:** Testing and development verification
          - **Signing:** Signed with a temporary debug keystore (not a Play Store production release)

          The debug APK file is attached below under **Assets** for direct download on Android devices.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG and title: $RELEASE_TITLE"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          echo "=================================================="
          echo "               BUILD & RELEASE SUMMARY             "
          echo "=================================================="

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Asset Filename: $ASSET_NAME"

            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG")
            echo "Release URL: $RELEASE_URL"

            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "### ✅ GitHub Release Published Successfully"
              echo "- **Release Page:** [View Release ($RELEASE_TAG)]($RELEASE_URL)"
              echo "- **Direct APK Asset:** \`$ASSET_NAME\`"
              echo "- **Download Instructions:** Open the release link on your Android phone and download \`$ASSET_NAME\` under the **Assets** section."
              echo ""
              echo "### 📦 Backup Actions Artifact"
              echo "- The standard GitHub Actions artifact named \`app-debug-apk\` is also available under the workflow run summary as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            echo "The debug APK build succeeded and the artifact named 'app-debug-apk' was preserved."
            echo "Check workflow permissions if release creation is desired (contents: write required)."

            {
              echo "## ⚠️ Debug APK Build & Release Summary"
              echo ""
              echo "### ⚠️ GitHub Release Notice"
              echo "GitHub Release publishing did not complete, but the debug APK was successfully built!"
              echo ""
              echo "### 📦 Download Backup Artifact"
              echo "- The debug APK was uploaded and preserved as a standard GitHub Actions artifact named **\`app-debug-apk\`**."
              echo "- You can download it directly from the **Artifacts** section at the bottom of this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
